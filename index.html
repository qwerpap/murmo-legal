<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Murmo</title>
<style>
:root{--bg:#0A0C18;--bg2:#141836;--ink:#E9E8F2;--soft:#9A9BB8;--line:#2B2F57;--acc:#B7B4FF}
@media (prefers-color-scheme:light){:root{--bg:#F4F2EE;--bg2:#E5E2F2;--ink:#1D1B33;--soft:#605E80;--line:#CFCBE6;--acc:#4B43C4}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg) 0,var(--bg2) 100%) fixed;color:var(--ink);font:300 17px/1.75 "Helvetica Neue",-apple-system,"Segoe UI",sans-serif}
main{max-width:600px;margin:0 auto;padding:56px 22px 70px}
.moon{width:34px;height:34px;border-radius:50%;box-shadow:inset -10px -4px 0 0 var(--acc);margin:0 0 22px}
h1{font-weight:200;font-size:34px;letter-spacing:.02em;margin:0 0 6px}
.d{color:var(--soft);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 34px}
h2{font-weight:500;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin:42px 0 8px}
p{margin:.5em 0}
a{color:var(--acc)}
hr{border:0;border-top:1px solid var(--line);margin:36px 0}
ol{padding-left:1.3em}li{margin:.35em 0}
nav{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
nav a{text-decoration:none;color:var(--soft)}
</style></head><body>
<main><div class="moon"></div><h1>Murmo</h1><p class="d">Sleep sounds mixer</p><p>Layer rain, noise, a fireplace and slow music into one sound of your own.</p><nav><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="support.html">Support</a></nav></main>
</body></html>
